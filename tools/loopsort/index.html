<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d2f4e5">
<title>CANDY FACTORY</title>
<link rel="stylesheet" href="./factory-ui.css">
</head>
<body>
<div class="factory-wings" aria-hidden="true">
  <div class="factory-wing left"><i class="pipe"></i><i class="tank"></i><i class="gauge"></i><i class="gear"></i></div>
  <div class="factory-wing right"><i class="pipe"></i><i class="tank"></i><i class="gauge"></i><i class="gear"></i></div>
</div>
<div id="frame">
  <canvas id="stage"></canvas>
  <div id="home" class="layer">
    <div class="scrim"></div>
    <div class="home-in">
      <h1 class="logo">CANDY<span>FACTORY</span></h1>
      <svg class="factory-hero" viewBox="0 0 420 370" aria-hidden="true">
        <defs>
          <linearGradient id="mint" x2="0.85" y2="1"><stop stop-color="#acffe1"/><stop offset="1" stop-color="#35b99b"/></linearGradient>
          <linearGradient id="cream" x2="0.8" y2="1"><stop stop-color="#fffdf0"/><stop offset="1" stop-color="#f5d69b"/></linearGradient>
          <linearGradient id="pink" x2="0.6" y2="1"><stop stop-color="#ffa2b4"/><stop offset=".5" stop-color="#ff718f"/><stop offset="1" stop-color="#d43d68"/></linearGradient>
          <linearGradient id="glass" x2=".85" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#a2ecdd" stop-opacity=".5"/></linearGradient>
          <radialGradient id="lemon" cx=".3" cy=".2" r=".85"><stop stop-color="#fff7a0"/><stop offset=".55" stop-color="#ffd650"/><stop offset="1" stop-color="#ed9e35"/></radialGradient>
          <radialGradient id="grape" cx=".3" cy=".2" r=".85"><stop stop-color="#e7c2ff"/><stop offset=".6" stop-color="#b98aee"/><stop offset="1" stop-color="#8661c6"/></radialGradient>
          <filter id="toy-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="3" flood-color="#367c68" flood-opacity=".18"/></filter>
          <g id="sweet"><path d="m-15-5-13-7 3 12-3 12 13-7m30-10 13-7-3 12 3 12-13-7" fill="#ffb4c4" stroke="#e97391" stroke-width="2"/><rect x="-17" y="-14" width="34" height="28" rx="12" fill="url(#pink)"/><path d="m-6-10 8 20" stroke="#fff7df" stroke-width="7"/><path d="M-11-7h5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
        </defs>
        <ellipse cx="211" cy="322" rx="173" ry="23" fill="#78cbb0" opacity=".25"/>
        <g class="factory-bubbles" fill="#fffdf0" stroke="#a4dec9" stroke-width="2"><circle cx="298" cy="43" r="12"/><circle cx="319" cy="20" r="7"/><circle cx="279" cy="16" r="5"/></g>
        <g filter="url(#toy-shadow)">
          <path d="M288 170V70h32v127" fill="url(#pink)" stroke="#ce637c" stroke-width="4"/>
          <path d="m290 92 27-13m-27 44 27-13m-27 44 27-13" stroke="#fff2de" stroke-width="12"/>
          <rect x="282" y="62" width="44" height="17" rx="8" fill="url(#cream)"/>
          <path d="M90 153h227l18 17v129H105l-15-16Z" fill="#389d89"/>
          <rect x="83" y="147" width="237" height="148" rx="29" fill="url(#mint)" stroke="#3cad92" stroke-width="3"/>
          <path d="M102 162h197" stroke="#d4ffea" stroke-width="7" stroke-linecap="round"/>
          <rect x="116" y="174" width="113" height="86" rx="21" fill="url(#cream)" stroke="#fff6d8" stroke-width="5"/>
          <rect x="135" y="188" width="75" height="46" rx="13" fill="#633e59"/>
          <circle cx="154" cy="205" r="5" fill="#fffbe6"/><circle cx="192" cy="205" r="5" fill="#fffbe6"/>
          <path d="M163 217q10 9 20 0" fill="none" stroke="#ffb1c7" stroke-width="4" stroke-linecap="round"/>
          <rect x="143" y="250" width="57" height="31" rx="11" fill="#398e7e"/>
          <rect x="254" y="184" width="42" height="55" rx="16" fill="#258d7c"/>
          <circle cx="275" cy="204" r="13" fill="url(#lemon)"/><path d="M270 197h6" stroke="#fff9d6" stroke-width="4" stroke-linecap="round"/>
          <circle cx="267" cy="229" r="3" fill="#ffb4c4"/><circle cx="282" cy="229" r="3" fill="#fff3ca"/>
          <path d="M124 99h92l-14 46h-64Z" fill="url(#cream)" stroke="#dabd89" stroke-width="3"/>
          <rect x="111" y="50" width="118" height="65" rx="25" fill="url(#glass)" stroke="#fffcf0" stroke-width="5"/>
          <circle cx="143" cy="91" r="16" fill="url(#pink)"/><circle cx="176" cy="95" r="15" fill="url(#lemon)"/><circle cx="205" cy="90" r="14" fill="url(#grape)"/>
          <circle cx="162" cy="68" r="15" fill="url(#grape)"/><circle cx="194" cy="65" r="14" fill="url(#pink)"/>
          <path d="M123 83V73q0-12 12-12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
          <rect x="108" y="42" width="125" height="17" rx="8" fill="url(#cream)"/>
          <path d="M122 42q46-34 97 0" fill="url(#pink)"/><circle cx="171" cy="25" r="9" fill="url(#lemon)"/>
          <path d="M63 284h292v35H63z" fill="#539786"/>
          <rect x="48" y="268" width="320" height="44" rx="22" fill="#fff2cd" stroke="#dabc86" stroke-width="3"/>
          <rect x="58" y="277" width="300" height="26" rx="13" fill="#76526a"/>
          <g fill="#b68aa2"><circle cx="76" cy="290" r="7"/><circle cx="106" cy="290" r="7"/><circle cx="136" cy="290" r="7"/><circle cx="166" cy="290" r="7"/><circle cx="196" cy="290" r="7"/><circle cx="226" cy="290" r="7"/><circle cx="256" cy="290" r="7"/><circle cx="286" cy="290" r="7"/><circle cx="316" cy="290" r="7"/><circle cx="342" cy="290" r="7"/></g>
          <use href="#sweet" transform="translate(92 253) rotate(-12)"/><use href="#sweet" transform="translate(242 254) rotate(8)"/>
          <path d="m284 244 27-11 28 11v30l-28 13-27-13Z" fill="#ffc966" stroke="#d99b4b" stroke-width="2"/>
          <path d="m284 244 27 12 28-12m-28 12v31" fill="none" stroke="#ffe6a4" stroke-width="3"/>
          <path d="m298 239 27 12v14l-11 5v-14l-27-12Z" fill="#ff819a"/>
        </g>
        <g class="hero-sparkles" fill="#fff" stroke="#f1bd63" stroke-width="2"><path d="m63 106 4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/><path d="m353 186 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/></g>
        <use href="#sweet" transform="translate(54 198) rotate(-30) scale(.75)"/>
        <circle cx="355" cy="114" r="17" fill="url(#lemon)"/><path d="M347 107q4-6 10-3" fill="none" stroke="#fff6c9" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div class="home-bot">
        <button id="btnPlay" class="big">LEVEL <b id="homeLv">1</b><small id="homeArea"></small><span class="play-arrow" aria-hidden="true">▶</span></button>
        <div class="coin" id="homeCoins" aria-label="Xu">0</div>
        <div id="homeSound" class="home-controls"></div>
      </div>
    </div>
  </div>
  <div id="chrome" class="layer hide">
    <div id="topbar">
      <div class="grp"><button id="btnHome" class="ic" title="Về nhà" aria-label="Về nhà"></button><button id="btnRetry" class="ic" title="Chơi lại" aria-label="Chơi lại"></button></div>
      <div id="levelPill" class="mid"><span class="lbl">Level</span><em hidden></em><b id="hudLv">1</b><span class="sep"></span><i class="candyIcon" aria-hidden="true"></i><b id="hudBags">0 / 32</b></div>
      <div class="coin sm" id="gameCoins">0</div>
    </div>
    <div id="beltGauge" hidden aria-hidden="true"><i></i><b>0 / 28</b></div>
    <div id="hint" class="hint" hidden role="status"></div>
    <div id="toolDock"><div id="tools" class="tools"></div><div id="gameSound"></div></div>
  </div>
  <div id="cards" class="layer hide" role="dialog" aria-modal="true" aria-label="Candy Factory"></div>
  <button id="btnSound" class="sound-toggle" type="button" title="Âm thanh" aria-label="Tắt âm thanh" aria-pressed="true"></button>
</div>
<button id="devBtn">dev</button>
<aside id="dev" class="hide"></aside>
<script type="module" src="./app.js"></script>
</body>
</html>
